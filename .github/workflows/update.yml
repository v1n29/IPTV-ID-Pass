name: Auto-Update M3U

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Shadow Protocol
        env:
          OTTC_COOKIE: ${{ secrets.OTTC_COOKIE }}
        run: node scraper.js

      - name: Upload to VIP Loading Dock
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: master.m3u.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
