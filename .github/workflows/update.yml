name: Auto-Update M3U

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Shadow Protocol
        env:
          OTTC_COOKIE: ${{ secrets.OTTC_COOKIE }}
        run: node scraper.js

      - name: Save the compressed playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # THE FIX: Tell git to track the new .gz file
          git add master.m3u.gz
          git commit -m "Update compressed playlist" || echo "No changes"
          git push
          
